version: '3.8'
services:
  ai-empire:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-empire
    network_mode: "host"
    volumes:
      - ./logs:/logs
      - ./empire_data:/empire_data
    environment:
      - EMPIRE_LOG_PATH=/logs/empire.log
      - PYTHONPATH=/empire
      - OLLAMA_HOST=localhost:11434
    restart: unless-stopped
